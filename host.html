<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Запуск эфира — Y-FETISH LIVE</title>
  <meta name="description" content="Запусти прямой эфир на Y-FETISH LIVE.">
  <link rel="stylesheet" href="/style.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button, input { font: inherit; }
    [hidden] { display: none !important; }

    header {
      padding: 16px 5%;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .logo {
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
    }

    .logo span { color: #f22; }

    main {
      width: min(720px, 94%);
      margin: 25px auto;
    }

    .panel {
      padding: 22px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
    }

    h1 { font-size: 25px; }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #ccc;
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 13px;
      background: #101010;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 16px;
    }

    button, .watch-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 16px;
      margin: 10px 6px 0 0;
      border: 0;
      border-radius: 9px;
      background: #e21b2d;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }
    .secondary { background: #333; }

    #preview {
      display: block;
      width: 100%;
      max-height: 420px;
      margin-top: 15px;
      background: #000;
      border-radius: 10px;
      object-fit: cover;
    }

    .muted {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #eee;
      font-size: 14px;
      line-height: 1.45;
    }

    .camera-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .camera-controls button { margin-right: 0; }

    #streamForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .studio-stage { position: relative; }
    .studio-top { margin-bottom: 12px; }
    .studio-top label { margin-top: 0; }
    #startButton { width: 100%; }

    @media (max-width: 800px) {
      html, body {
        width: 100%;
        min-height: 100%;
        background: #000;
      }

      body.studio-active {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      body.studio-active > header { display: none; }

      body.studio-active main {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        margin: 0;
      }

      #loginPanel {
        width: calc(100% - 28px);
        margin: 20px auto;
      }

      #studioPanel {
        position: fixed;
        inset: 0;
        z-index: 10;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        border: 0;
        border-radius: 0;
      }

      .studio-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      #preview {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        max-height: none;
        margin: 0;
        border-radius: 0;
        background: #000;
        object-fit: cover;
      }

      .studio-top {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: 12px;
        right: 12px;
        z-index: 5;
        margin: 0;
        padding: 9px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 12px;
        background: rgba(15,15,15,.76);
        backdrop-filter: blur(10px);
      }

      .studio-top label {
        margin: 0 0 5px;
        color: #ddd;
        font-size: 11px;
      }

      #streamForm {
        display: block;
        margin: 0;
      }

      #streamTitle {
        padding: 9px 11px;
        background: rgba(0,0,0,.65);
        border-color: #444;
        border-radius: 8px;
        font-size: 14px;
      }

      /* Кнопка запуска эфира — внизу экрана */
      #startButton {
        position: fixed !important;
        top: auto !important;
        left: 50% !important;
        right: auto !important;
        bottom: calc(90px + env(safe-area-inset-bottom, 0px)) !important;
        z-index: 20 !important;
        transform: translateX(-50%);
        display: inline-flex;
        width: auto;
        min-width: 155px;
        min-height: 44px;
        padding: 10px 22px;
        margin: 0;
        border: 0;
        border-radius: 10px;
        background: #e21b2d;
        color: #fff;
        box-shadow: 0 4px 18px rgba(226,27,45,.3);
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
      }

      #startButton[hidden] { display: none !important; }

      .camera-controls {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        z-index: 15;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 7px;
      }

      .camera-controls button,
      .camera-controls .watch-link {
        flex: 0 1 auto;
        min-width: 0;
        min-height: 36px;
        padding: 8px 11px;
        margin: 0;
        border-radius: 9px;
        font-size: 12px;
      }

      #status {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(145px + env(safe-area-inset-bottom, 0px));
        z-index: 12;
        max-height: 14%;
        margin: 0;
        padding: 7px 9px;
        overflow: auto;
        border-radius: 8px;
        background: rgba(0,0,0,.58);
        font-size: 11px;
        text-shadow: 0 1px 3px #000;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="/live.html">Y<span>-</span>FETISH LIVE</a>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h1>Панель ведущего</h1>
      <p class="muted">Войди, чтобы включить камеру и начать эфир.</p>

      <form id="loginForm">
        <label for="password">Пароль ведущего</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
        <button id="loginButton" type="submit">Войти</button>
      </form>

      <p id="loginHelp" class="muted">
        После входа разреши доступ к камере и микрофону.
      </p>
    </section>

    <section id="studioPanel" class="panel" hidden>
      <div class="studio-stage">
        <video id="preview" autoplay playsinline muted hidden></video>

        <div class="studio-top">
          <label for="streamTitle">Название эфира</label>

          <form id="streamForm">
            <input
              id="streamTitle"
              name="streamTitle"
              type="text"
              maxlength="100"
              placeholder="Например, Прямой эфир"
              required
            >

            <input
              id="roomName"
              name="roomName"
              type="hidden"
              value="live-main"
            >

            <button id="startButton" type="submit">
              Начать эфир
            </button>
          </form>
        </div>

        <div class="camera-controls">
          <button id="cameraButton" type="button" class="secondary">
            Переключить камеру
          </button>

          <button id="stopButton" type="button" hidden>
            Завершить эфир
          </button>

          <a
            id="watchLink"
            class="watch-link"
            href="/live.html"
            target="_blank"
            rel="noopener"
            hidden
          >Открыть эфир</a>

          <button id="logoutButton" type="button" class="secondary">
            Выйти
          </button>
        </div>

        <p id="status" role="status" aria-live="polite">
          Проверяем вход...
        </p>
      </div>
    </section>
  </main>

  <script src="/host.js" defer></script>
</body>
</html>
