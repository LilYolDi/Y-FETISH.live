<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Студия эфира — Y-FETISH LIVE</title>
  <meta name="description" content="Студия прямых эфиров Y-FETISH LIVE.">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { padding: 20px; }
    [hidden] { display: none !important; }
    button, input { font: inherit; }

    button, .watch-link {
      min-height: 44px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #e21b2d;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    button:disabled { opacity: .6; cursor: wait; }

    button.secondary {
      background: #303030;
      border: 1px solid #484848;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #151515;
      color: #fff;
      font-size: 16px;
    }

    .page-header {
      max-width: 900px;
      margin: 0 auto 20px;
    }

    .logo {
      color: #fff;
      font-size: 27px;
      font-weight: 900;
      text-decoration: none;
    }

    .logo-y { color: #e21b2d; }

    .panel {
      width: 100%;
      max-width: 480px;
      margin: 25px auto;
      padding: 22px;
      border: 1px solid #303030;
      border-radius: 16px;
      background: #121212;
    }

    .panel h1 { margin: 0 0 20px; font-size: 23px; }

    #loginForm, #streamForm {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #loginButton { width: 100%; min-height: 48px; }

    .studio-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .studio-top { display: flex; flex-direction: column; gap: 8px; }
    .studio-top label { font-size: 14px; color: #ddd; }

    #preview {
      display: block;
      width: 100%;
      max-height: 65vh;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
    }

    .camera-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 9px;
    }

    .camera-controls button,
    .camera-controls .watch-link { flex: 1 1 130px; }

    #status {
      min-height: 20px;
      margin: 0;
      color: #ccc;
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (max-width: 800px) {
      body.studio-active {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        overflow: hidden;
      }

      body.studio-active .page-header { display: none; }

      body.studio-active #studioPanel {
        position: fixed;
        inset: 0;
        z-index: 100;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: #080808;
      }

      body.studio-active .studio-stage {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        overflow: hidden;
      }

      body.studio-active #preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-height: none;
        aspect-ratio: auto;
        border-radius: 0;
        object-fit: cover;
        background: #080808;
      }

      body.studio-active .studio-top {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: 12px;
        right: 12px;
        z-index: 110;
        gap: 7px;
      }

      body.studio-active .studio-top label {
        color: #fff;
        font-size: 13px;
        text-shadow: 0 1px 4px #000;
      }

      body.studio-active #streamForm { gap: 0; width: 100%; }

      body.studio-active #streamTitle {
        width: 100%;
        min-height: 46px;
        padding: 11px 12px;
        border: 1px solid #555;
        border-radius: 10px;
        background: rgba(15,15,15,.9);
        color: #fff;
        font-size: 16px;
      }

      body.studio-active #startButton {
        position: fixed;
        left: 50%;
        right: auto;
        top: auto;
        bottom: calc(82px + env(safe-area-inset-bottom, 0px));
        z-index: 130;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(220px, calc(100vw - 32px));
        min-height: 48px;
        margin: 0;
        padding: 12px 18px;
        transform: translateX(-50%);
        border-radius: 11px;
        background: #e21b2d;
        color: #fff;
        font-size: 15px;
        white-space: nowrap;
        box-shadow: 0 4px 18px rgba(226,27,45,.35);
      }

      body.studio-active .camera-controls {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 120;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 0;
        padding: 0;
      }

      body.studio-active .camera-controls button,
      body.studio-active .camera-controls .watch-link {
        flex: 0 1 auto;
        min-width: 0;
        min-height: 40px;
        max-width: 100%;
        margin: 0;
        padding: 9px 12px;
        border-radius: 9px;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      body.studio-active #status {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(132px + env(safe-area-inset-bottom, 0px));
        z-index: 115;
        color: #fff;
        font-size: 12px;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
      }
    }

    @media (max-width: 380px) {
      body.studio-active .camera-controls { left: 6px; right: 6px; gap: 5px; }

      body.studio-active .camera-controls button,
      body.studio-active .camera-controls .watch-link {
        padding: 8px 9px;
        font-size: 11px;
      }
    }

    @media (max-height: 500px) and (max-width: 800px) {
      body.studio-active #startButton {
        bottom: calc(66px + env(safe-area-inset-bottom, 0px));
        min-height: 42px;
      }

      body.studio-active .studio-top {
        top: calc(5px + env(safe-area-inset-top, 0px));
      }

      body.studio-active #status {
        bottom: calc(108px + env(safe-area-inset-bottom, 0px));
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <a class="logo" href="/">
      <span class="logo-y">Y</span>-FETISH LIVE
    </a>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h1>Вход ведущего</h1>

      <form id="loginForm">
        <label for="password">Пароль ведущего</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Введите пароль"
          required
        >
        <button id="loginButton" type="submit">Войти</button>
      </form>
    </section>

    <section id="studioPanel" class="panel" hidden>
      <div class="studio-stage">
        <video id="preview" autoplay playsinline muted hidden></video>

        <div class="studio-top">
          <label for="streamTitle">Название эфира</label>

          <form id="streamForm">
            <input
              id="streamTitle"
              name="title"
              type="text"
              placeholder="Например, Прямой эфир"
              maxlength="100"
              required
            >

            <input id="roomName" type="hidden" value="live-main">
            <button id="startButton" type="submit">Начать эфир</button>
          </form>
        </div>

        <div class="camera-controls">
          <button id="cameraButton" type="button" class="secondary">
            Переключить камеру
          </button>

          <button id="stopButton" type="button" hidden>
            Завершить эфир
          </button>

          <a
            id="watchLink"
            class="watch-link"
            href="/live.html"
            target="_blank"
            rel="noopener"
            hidden
          >Открыть эфир</a>

          <button id="logoutButton" type="button" class="secondary">
            Выйти
          </button>
        </div>

        <p id="status" role="status" aria-live="polite">
          Проверяем вход...
        </p>
      </div>
    </section>
  </main>

  <script src="/host.js" defer></script>
</body>
</html>
