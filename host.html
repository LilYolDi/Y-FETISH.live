<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Студия эфира — Y-FETISH LIVE</title>
  <meta name="description" content="Студия прямых эфиров Y-FETISH LIVE.">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { padding: 20px; }
    [hidden] { display: none !important; }
    button, input, select { font: inherit; }

    button, .watch-link {
      min-height: 44px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #e21b2d;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    button:disabled { opacity: .6; cursor: wait; }

    button.secondary {
      background: #303030;
      border: 1px solid #484848;
    }

    input, select {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #151515;
      color: #fff;
      font-size: 16px;
    }

    .page-header {
      max-width: 900px;
      margin: 0 auto 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0;
      font-family: "Arial Rounded MT Bold", Arial, sans-serif;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
      text-decoration: none;
      color: #fff;
    }

    .logo-y { color: #fff; font-weight: 900; }
    .logo-name { color: #ff3038; font-weight: 900; }

    .logo-live {
      margin-left: 7px;
      padding: 4px 8px;
      border-radius: 7px;
      background: #ff3038;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .panel {
      width: 100%;
      max-width: 480px;
      margin: 25px auto;
      padding: 22px;
      border: 1px solid #303030;
      border-radius: 16px;
      background: #121212;
    }

    .panel h1 { margin: 0 0 20px; font-size: 23px; }

    #loginForm, #streamForm {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #loginButton { width: 100%; min-height: 48px; }

    .studio-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .studio-top { display: flex; flex-direction: column; gap: 8px; }
    .studio-top label { font-size: 14px; color: #ddd; }

    #preview {
      display: block;
      width: 100%;
      max-height: 65vh;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
    }

    .camera-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 9px;
    }

    .camera-controls button,
    .camera-controls .watch-link { flex: 1 1 130px; }

    /* Камера и Beauty */
    #cameraButton,
    #beautyButton {
      position: absolute;
      right: 12px;
      z-index: 125;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      background: rgba(35,35,35,.88);
      color: #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,.25);
      -webkit-tap-highlight-color: transparent;
    }

    #cameraButton { top: 12px; }

    #beautyButton {
      top: 68px;
      background: rgba(226,27,45,.92);
      border-color: rgba(255,255,255,.3);
    }

    #cameraButton svg,
    #beautyButton svg {
      display: block;
      width: 23px;
      height: 23px;
    }

    #cameraButton:active,
    #beautyButton:active {
      transform: scale(.96);
    }

    #cameraButton:active { background: rgba(75,75,75,.95); }
    #beautyButton:active { background: #ff3038; }

    .mask-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 260px;
    }

    .mask-control label {
      color: #eee;
      font-size: 13px;
    }

    #maskSelect {
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid #555;
      border-radius: 10px;
      background: rgba(20,20,20,.94);
      color: #fff;
    }

    body:not(.studio-active) #beautyButton { display: none; }
    body.studio-active .mask-control { display: none; }
    body.studio-active .mask-control.beauty-open { display: flex; }

    #status {
      min-height: 20px;
      margin: 0;
      color: #ccc;
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

/* Чат ведущего: только сообщения поверх видео, без фона */
#hostChat {
  position: fixed;
  z-index: 140;
  left: 12px;
  bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  width: min(300px, calc(100vw - 24px));
  max-height: 32vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  color: #fff;
}

#hostChat[hidden] {
  display: none !important;
}

#hostChatHeader {
  display: none !important;
}

#hostChatMessages {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 30px;
  padding: 9px 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  overflow-wrap: anywhere;
  font-size: 13px;
  background: transparent !important;
}

.host-chat-message {
  line-height: 1.35;
  color: #fff;
  text-shadow: 0 1px 3px #000, 0 1px 6px #000;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
}

.host-chat-name {
  color: #ff5252;
  font-weight: 700;
}

.host-chat-empty {
  color: #fff;
  text-shadow: 0 1px 3px #000;
  background: transparent !important;
}

    @media (max-width: 800px) {
      body.studio-active {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        overflow: hidden;
      }

      body.studio-active .page-header { display: none; }

      body.studio-active #studioPanel {
        position: fixed;
        inset: 0;
        z-index: 100;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: #080808;
      }

      body.studio-active .studio-stage {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        overflow: hidden;
      }

      body.studio-active #preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-height: none;
        aspect-ratio: auto;
        border-radius: 0;
        object-fit: cover;
        background: #080808;
      }

      body.studio-active .studio-top {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: 12px;
        right: 76px;
        z-index: 110;
        gap: 7px;
      }

      body.studio-active .studio-top label {
        color: #fff;
        font-size: 13px;
        text-shadow: 0 1px 4px #000;
      }

      body.studio-active #streamForm {
        gap: 7px;
        width: 100%;
      }

      body.studio-active #streamTitle,
      body.studio-active #streamCountry {
        width: 100%;
        min-height: 42px;
        padding: 9px 10px;
        border: 1px solid #555;
        border-radius: 9px;
        background: rgba(15,15,15,.9);
        color: #fff;
        font-size: 15px;
      }

      body.studio-active #startButton {
        position: fixed;
        left: 50%;
        right: auto;
        top: auto;
        bottom: calc(82px + env(safe-area-inset-bottom, 0px));
        z-index: 130;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(220px, calc(100vw - 32px));
        min-height: 48px;
        margin: 0;
        padding: 12px 18px;
        transform: translateX(-50%);
        border-radius: 11px;
        background: #e21b2d;
        color: #fff;
        font-size: 15px;
        white-space: nowrap;
        box-shadow: 0 4px 18px rgba(226,27,45,.35);
      }

      body.studio-active .camera-controls {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 120;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 0;
        padding: 0;
      }

      body.studio-active .camera-controls button,
      body.studio-active .camera-controls .watch-link {
        flex: 0 1 auto;
        min-width: 0;
        min-height: 40px;
        max-width: 100%;
        margin: 0;
        padding: 9px 12px;
        border-radius: 9px;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      body.studio-active #cameraButton,
      body.studio-active #beautyButton {
        position: fixed;
        left: auto;
        right: 14px;
        z-index: 125;
        width: 48px;
        height: 48px;
        min-width: 48px;
        min-height: 48px;
        padding: 0;
        border-radius: 50%;
      }

      body.studio-active #cameraButton {
        top: calc(12px + env(safe-area-inset-top, 0px));
        bottom: auto;
      }

      body.studio-active #beautyButton {
        top: calc(68px + env(safe-area-inset-top, 0px));
        bottom: auto;
      }

      body.studio-active .mask-control.beauty-open {
        position: fixed;
        left: 12px;
        right: 74px;
        top: calc(126px + env(safe-area-inset-top, 0px));
        bottom: auto;
        z-index: 126;
        width: auto;
        max-width: 260px;
        gap: 4px;
        padding: 10px;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 12px;
        background: rgba(15,15,15,.94);
      }

      body.studio-active .mask-control label {
        color: #fff;
        font-size: 12px;
        text-shadow: 0 1px 4px #000;
      }

      body.studio-active #maskSelect {
        min-height: 40px;
        font-size: 14px;
      }

      body.studio-active #status {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(132px + env(safe-area-inset-bottom, 0px));
        z-index: 115;
        color: #fff;
        font-size: 12px;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
      }

      body.studio-active #hostChat {
        left: 10px;
        bottom: calc(175px + env(safe-area-inset-bottom, 0px));
        width: min(280px, calc(100vw - 20px));
        max-height: 25vh;
      }
    }

    @media (max-width: 600px) {
      .logo { font-size: 23px; }

      .logo-live {
        font-size: 12px;
        padding: 3px 6px;
        margin-left: 5px;
      }
    }

    @media (max-width: 380px) {
      .logo { font-size: 21px; }

      .logo-live {
        font-size: 11px;
        padding: 3px 5px;
        margin-left: 4px;
      }

      body.studio-active .camera-controls {
        left: 6px;
        right: 6px;
        gap: 5px;
      }

      body.studio-active .camera-controls button,
      body.studio-active .camera-controls .watch-link {
        padding: 8px 9px;
        font-size: 11px;
      }

      body.studio-active #cameraButton,
      body.studio-active #beautyButton {
        right: 14px;
      }

      body.studio-active .studio-top { right: 72px; }
    }

    @media (max-height: 500px) and (max-width: 800px) {
      body.studio-active #startButton {
        bottom: calc(66px + env(safe-area-inset-bottom, 0px));
        min-height: 42px;
      }

      body.studio-active .studio-top {
        top: calc(5px + env(safe-area-inset-top, 0px));
      }

      body.studio-active #status {
        bottom: calc(108px + env(safe-area-inset-bottom, 0px));
      }

      body.studio-active #cameraButton {
        top: calc(8px + env(safe-area-inset-top, 0px));
        bottom: auto;
      }

      body.studio-active #beautyButton {
        top: calc(62px + env(safe-area-inset-top, 0px));
        bottom: auto;
      }

      body.studio-active .mask-control.beauty-open {
        top: calc(118px + env(safe-area-inset-top, 0px));
        bottom: auto;
      }

      body.studio-active #hostChat {
        bottom: calc(125px + env(safe-area-inset-bottom, 0px));
        max-height: 20vh;
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <a class="logo" href="/">
      <span class="logo-y">Y</span><span class="logo-name">-FETISH</span><span class="logo-live">LIVE</span>
    </a>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h1>Вход ведущего</h1>
      <form id="loginForm">
        <label for="password">Пароль ведущего</label>
        <input id="password" name="password" type="password"
          autocomplete="current-password" placeholder="Введите пароль" required>
        <button id="loginButton" type="submit">Войти</button>
      </form>
    </section>

    <section id="studioPanel" class="panel" hidden>
      <div class="studio-stage">
        <video id="preview" autoplay playsinline muted hidden></video>

        <div class="studio-top">
          <label for="streamTitle">Название эфира</label>
          <form id="streamForm">
            <input id="streamTitle" name="title" type="text"
              placeholder="Например, Прямой эфир" maxlength="100" required>

            <label for="streamCountry">Страна эфира</label>
            <select id="streamCountry" name="country" required
              style="width:100%;min-height:46px;padding:12px;border:1px solid #444;border-radius:10px;background:#151515;color:#fff;font-size:16px;">
              <option value="Украина">🇺🇦 Украина</option>
              <option value="Россия">🇷🇺 Россия</option>
              <option value="Польша">🇵🇱 Польша</option>
              <option value="Германия">🇩🇪 Германия</option>
              <option value="Другие">🌐 Другие</option>
            </select>

            <input id="roomName" type="hidden" value="live-main">
            <button id="startButton" type="submit">Начать эфир</button>
          </form>
        </div>

        <button id="cameraButton" type="button"
          aria-label="Переключить камеру" title="Переключить камеру">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M20 7v5h-5"/>
            <path d="M4 17v-5h5"/>
            <path d="M5.6 9A7 7 0 0 1 17.5 6L20 12"/>
            <path d="M18.4 15A7 7 0 0 1 6.5 18L4 12"/>
          </svg>
        </button>

        <button id="beautyButton" type="button"
          aria-label="Открыть Beauty-фильтры"
          title="Beauty-фильтры"
          aria-expanded="false"
          aria-controls="maskSelect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/>
            <path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z"/>
            <path d="m5 15 .7 1.3L7 17l-1.3.7L5 19l-.7-1.3L3 17l1.3-.7L5 15Z"/>
          </svg>
        </button>

        <div class="mask-control">
          <label for="maskSelect">Beauty-фильтры</label>
          <select id="maskSelect">
            <option value="none">Без фильтра</option>
            <option value="beauty">✨ Beauty</option>
            <option value="glamour">💄 Glamour</option>
            <option value="makeup">💋 Макияж</option>
            <option value="pink">🩷 Pink</option>
          </select>
        </div>

        <div class="camera-controls">
          <button id="stopButton" type="button" hidden>Завершить эфир</button>
          <a id="watchLink" class="watch-link" href="/live.html"
            target="_blank" rel="noopener" hidden>Открыть эфир</a>
          <button id="logoutButton" type="button" class="secondary">Выйти</button>
        </div>

        <p id="status" role="status" aria-live="polite">Проверяем вход...</p>
      </div>
    </section>
  </main>

  <!-- Панель чата. host.js управляет сообщениями и видимостью во время эфира. -->
  <aside id="hostChat" aria-label="Чат зрителей" hidden>
    <div id="hostChatHeader">
      <span>💬 Чат зрителей</span>
      <span id="hostChatCount">0</span>
    </div>
    <div id="hostChatMessages" aria-live="polite">
      <div class="host-chat-empty">Сообщений пока нет</div>
    </div>
  </aside>

  <script>
    (() => {
      const beautyButton = document.getElementById('beautyButton');
      const maskControl = document.querySelector('.mask-control');

      if (!beautyButton || !maskControl) return;

      beautyButton.addEventListener('click', () => {
        const isOpen = maskControl.classList.toggle('beauty-open');
        beautyButton.setAttribute('aria-expanded', String(isOpen));
      });

      document.getElementById('maskSelect')?.addEventListener('change', () => {
        maskControl.classList.remove('beauty-open');
        beautyButton.setAttribute('aria-expanded', 'false');
      });
    })();
  </script>

  <script src="/host.js" defer></script>
</body>
</html>
