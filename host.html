<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">

  <title>Запуск эфира — Y-FETISH LIVE</title>
  <meta name="description" content="Запусти прямой эфир на Y-FETISH LIVE.">

  <link rel="stylesheet" href="/style.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body { min-height: 100vh; }
    button, input { font: inherit; }
    [hidden] { display: none !important; }

    header {
      padding: 16px 5%;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .logo {
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
    }

    .logo span { color: #f22; }

    main {
      width: min(720px, 94%);
      margin: 25px auto;
    }

    .panel {
      margin-bottom: 18px;
      padding: 22px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
    }

    h1 { font-size: 25px; }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #ccc;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      background: #101010;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 16px;
    }

    button, .watch-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      margin: 10px 6px 0 0;
      border: 0;
      border-radius: 9px;
      background: #e21b2d;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .secondary { background: #333; }

    #preview {
      display: block;
      width: 100%;
      max-height: 420px;
      margin-top: 15px;
      background: #000;
      border-radius: 10px;
      object-fit: cover;
    }

    .muted {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .camera-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .camera-controls button { margin-right: 0; }

      html, body {
        width: 100%;
        min-height: 100%;
        background: #000;
      }

        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }

      body.studio-active > header { display: none; }

      main {
        width: 100%;
        margin: 0;
      }

      #loginPanel {
        width: calc(100% - 28px);
        margin: 20px auto;
      }

        z-index: 1;
