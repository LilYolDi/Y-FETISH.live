<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Прямой эфир — Y-FETISH LIVE</title>
  <meta name="description" content="Смотри прямые эфиры Y-FETISH LIVE, общайся со зрителями и отправляй виртуальные подарки.">
  <link rel="canonical" href="https://y-fetish-live.onrender.com/live.html">
  <link rel="stylesheet" href="/style.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body { min-height: 100vh; }
    button, input { font: inherit; }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 5%;
      background: #111;
      border-bottom: 1px solid #292929;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0;
      color: #fff;
      font-family: "Arial Rounded MT Bold", Arial, sans-serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      text-decoration: none;
      white-space: nowrap;
    }

    .logo-y { color: #fff; font-weight: 900; }
    .logo-name { color: #ff3038; font-weight: 900; }

    .logo-live {
      display: inline-block;
      margin-left: 7px;
      padding: 4px 8px;
      border-radius: 7px;
      background: #ff3038;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .back-link {
      color: #fff;
      font-size: 14px;
      text-decoration: none;
    }

    .live-layout {
      width: min(1200px, 94%);
      margin: 22px auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }

    .video-section { min-width: 0; }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 78vh;
      min-height: 380px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
      border: 1px solid #292929;
      border-radius: 14px;
      isolation: isolate;
    }

    .video-container video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #videoPlaceholder {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #bbb;
      text-align: center;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    #videoPlaceholder.hidden { display: none; }

    .play-icon {
      margin-bottom: 12px;
      color: #f22;
      font-size: 44px;
    }

    .live-label {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 14px;
      padding: 7px 11px;
      border-radius: 6px;
      background: #e21b2d;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    #status {
      position: absolute;
      z-index: 3;
      top: 15px;
      right: 12px;
      max-width: 65%;
      color: #fff;
      font-size: 12px;
      text-align: right;
      text-shadow: 0 1px 5px #000;
    }

    #status.hidden { display: none; }

    #streamTitle {
      margin: 16px 0 7px;
      font-size: 23px;
      overflow-wrap: anywhere;
    }

    .muted {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }

    .gift-panel, .chat-panel {
      padding: 16px;
      background: #171717;
      border: 1px solid #303030;
      border-radius: 12px;
    }

    .gift-panel { margin-top: 18px; }

    .gift-panel h2, .chat-panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .gift-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .gift-item {
      padding: 12px 8px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #252525;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .gift-item:hover { border-color: #f22; }

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 420px;
    }

    .chat-messages {
      min-height: 260px;
      max-height: 55vh;
      overflow-y: auto;
      overflow-wrap: anywhere;
      padding: 10px;
      background: #0d0d0d;
      border-radius: 8px;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .chat-form input {
      min-width: 0;
      width: 100%;
      flex: 1;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 22px;
      outline: none;
      background: #292929;
      color: #fff;
    }

    .chat-form input:focus { border-color: #e21b2d; }

    .chat-form button {
      flex-shrink: 0;
      padding: 11px 15px;
      border: 0;
      border-radius: 22px;
      background: #e21b2d;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .gift-toggle, .sound-toggle, .gift-close { display: none; }

    @media (min-width: 801px) {
      .video-section {
        width: min(100%, 520px);
        margin: 0 auto;
      }

      .video-container { max-height: 76vh; }
    }

    @media (max-width: 800px) {
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        background: #000;
      }

      .topbar {
        position: fixed;
        z-index: 15;
        top: 0;
        left: 0;
        right: 0;
        padding: calc(env(safe-area-inset-top) + 12px) 15px 12px;
        background: linear-gradient(to bottom, rgba(0,0,0,.78), transparent);
        border: 0;
      }

      .logo { font-size: 21px; }

      .logo-live {
        font-size: 12px;
        padding: 3px 6px;
        margin-left: 5px;
      }

      .back-link {
        padding: 8px 11px;
        border-radius: 18px;
        background: rgba(30,30,30,.8);
        font-size: 12px;
      }

      .live-layout {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .video-section {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        background: #000;
      }

      .video-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 0;
        max-height: none;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
      }

      .video-container video { object-fit: cover; }

      .live-label {
        top: calc(env(safe-area-inset-top) + 35px);
        left: 14px;
      }

      #status {
        top: calc(env(safe-area-inset-top) + 68px);
        right: 76px;
        max-width: 55%;
      }

      #streamTitle {
        position: fixed;
        z-index: 5;
        left: 14px;
        right: 76px;
        bottom: calc(env(safe-area-inset-bottom) + 174px);
        margin: 0;
        font-size: 18px;
        text-shadow: 0 1px 5px #000;
        pointer-events: none;
      }

      #hostName { display: none; }

      .chat-panel {
        position: fixed;
        z-index: 10;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 0;
        max-height: 48dvh;
        padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
        background: linear-gradient(to bottom, transparent, rgba(0,0,0,.52) 18%, rgba(0,0,0,.88));
        border: 0;
        border-radius: 0;
      }

      .chat-panel h2 { display: none; }

      .chat-messages {
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-height: 24dvh;
        overflow-y: auto;
        padding: 8px 2px;
        background: transparent;
        border-radius: 0;
        mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
      }

      .chat-messages p {
        margin: 5px 0;
        color: #fff;
        font-size: 13px;
        text-shadow: 0 1px 4px #000;
      }

      .chat-form {
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      .chat-form input {
        min-height: 43px;
        padding: 11px 15px;
        background: rgba(25,25,25,.9);
        border-color: rgba(255,255,255,.2);
      }

      .chat-form button {
        min-height: 43px;
        padding: 0 15px;
      }

      .chat-panel > .muted { display: none; }

      /* Круглые кнопки справа сверху, одна под другой */
      .gift-toggle,
      .sound-toggle {
        position: fixed;
        z-index: 25;
        right: 14px;
        top: calc(env(safe-area-inset-top) + 112px);
        bottom: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        min-width: 48px;
        min-height: 48px;
        padding: 0;
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 50%;
        background: rgba(35,35,35,.88);
        color: #fff;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 3px 12px rgba(0,0,0,.25);
        -webkit-tap-highlight-color: transparent;
      }

      .sound-toggle {
        top: calc(env(safe-area-inset-top) + 56px);
      }

      .sound-toggle:active,
      .gift-toggle:active {
        transform: scale(.95);
      }

      .gift-panel {
        display: none;
        position: fixed;
        z-index: 30;
        right: 10px;
        bottom: calc(env(safe-area-inset-bottom) + 72px);
        left: 10px;
        max-height: 48dvh;
        overflow-y: auto;
        margin: 0;
        padding: 16px;
        background: rgba(22,22,22,.97);
        border: 1px solid #444;
        border-radius: 16px;
        box-shadow: 0 0 30px rgba(0,0,0,.5);
      }

      body.show-gifts .gift-panel { display: block; }

      .gift-panel h2 { padding-right: 38px; }

      .gift-close {
        position: absolute;
        top: 10px;
        right: 12px;
        display: block;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        background: #333;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
      }

      .gift-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 380px) {
      .logo { font-size: 18px; }

      .logo-live {
        font-size: 11px;
        padding: 3px 5px;
        margin-left: 4px;
      }

      .chat-form button {
        padding: 0 12px;
        font-size: 13px;
      }

      .sound-toggle,
      .gift-toggle {
        right: 10px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="/">
      <span class="logo-y">Y</span><span class="logo-name">-FETISH</span><span class="logo-live">LIVE</span>
    </a>
    <a class="back-link" href="/">Все эфиры</a>
  </header>

  <main class="live-layout">
    <section class="video-section">
      <div id="videoContainer" class="video-container">
        <div id="videoPlaceholder">
          <div class="play-icon">▶</div>
          <p>Подключение к эфиру...</p>
        </div>

        <div class="live-label">LIVE</div>
        <div id="status" aria-live="polite">Подключение...</div>
      </div>

      <h1 id="streamTitle">Прямой эфир</h1>
      <p id="hostName" class="muted">Y-FETISH LIVE</p>

      <section class="gift-panel" id="giftPanel">
        <button class="gift-close" id="giftClose" type="button" aria-label="Закрыть подарки">×</button>
        <h2>🎁 Виртуальные подарки</h2>
        <p>Баланс: <strong id="coinBalance">0</strong> монет</p>

        <div id="giftList" class="gift-list">
          <p class="muted">Загрузка подарков...</p>
        </div>

        <p id="giftMessage" class="muted" aria-live="polite"></p>
      </section>
    </section>

    <aside class="chat-panel">
      <h2>Чат эфира</h2>

      <div id="chatMessages" class="chat-messages" aria-live="polite">
        <p class="muted">Подключение чата...</p>
      </div>

      <form id="chatForm" class="chat-form">
        <input
          id="chatInput"
          type="text"
          maxlength="300"
          placeholder="Написать сообщение..."
          autocomplete="off"
          aria-label="Сообщение в чат"
          required
        >
        <button type="submit">Отправить</button>
      </form>

      <p class="muted">Не указывай личные данные в сообщениях.</p>
    </aside>
  </main>

  <button
    id="soundToggle"
    class="sound-toggle"
    type="button"
    aria-label="Включить звук"
    aria-pressed="false"
    title="Включить звук"
  >🔇</button>

  <button
    id="giftToggle"
    class="gift-toggle"
    type="button"
    aria-label="Открыть подарки"
    aria-expanded="false"
  >🎁</button>

  <script>
    const giftToggle = document.getElementById("giftToggle");
    const giftClose = document.getElementById("giftClose");

    giftToggle.addEventListener("click", function () {
      document.body.classList.toggle("show-gifts");
      giftToggle.setAttribute(
        "aria-expanded",
        document.body.classList.contains("show-gifts") ? "true" : "false"
      );
    });

    giftClose.addEventListener("click", function () {
      document.body.classList.remove("show-gifts");
      giftToggle.setAttribute("aria-expanded", "false");
    });
  </script>

  <script>
    (function () {
      const container = document.getElementById("videoContainer");
      const placeholder = document.getElementById("videoPlaceholder");
      const status = document.getElementById("status");

      if (!container || !placeholder || !status) return;

      function updateLiveOverlay() {
        const videos = container.querySelectorAll("video");
        let playingVideoFound = false;

        videos.forEach(function (video) {
          if (video.readyState >= 2 && video.videoWidth > 0 && !video.paused) {
            playingVideoFound = true;
          }
        });

        placeholder.classList.toggle("hidden", playingVideoFound);
        status.classList.toggle("hidden", playingVideoFound);
      }

      const observer = new MutationObserver(updateLiveOverlay);
      observer.observe(container, { childList: true, subtree: true });

      container.addEventListener("playing", updateLiveOverlay, true);
      container.addEventListener("loadeddata", updateLiveOverlay, true);
      container.addEventListener("emptied", updateLiveOverlay, true);
      container.addEventListener("pause", updateLiveOverlay, true);
    })();
  </script>

  <script src="/app.js" defer></script>
</body>
</html>
