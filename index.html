    .account-email {

    .panel-button {

      padding: 18px;

    }

    /* Видеопревью эфира */
    .preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 150px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #090909;
      border-radius: 8px;
      color: #e5222e;

    .preview video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;

    }

    .preview-placeholder {

      inset: 0;
      display: grid;

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

  <script>
    "use strict";

    // Авторизация и отображение аккаунта
    const SUPABASE_URL = "https://cdyuxiicllnfrwssigsr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VuAtnZ0pGWc4BOsYTLBfeA_1Mb86lw0";

    const loginLink = document.getElementById("loginLink");
    const accountWrap = document.getElementById("accountWrap");
    const profileButton = document.getElementById("profileButton");
    const accountPanel = document.getElementById("accountPanel");
    const accountNickname = document.getElementById("accountNickname");
    const accountEmail = document.getElementById("accountEmail");
    const coinBalance = document.getElementById("coinBalance");
    const logoutButton = document.getElementById("logoutButton");
    const topupButton = document.getElementById("topupButton");
    const profileDetailsButton = document.getElementById("profileDetailsButton");
    const profileDetails = document.getElementById("profileDetails");

    const authClient = window.supabase?.createClient
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    async function loadAccountBalance(session) {
      if (!session?.access_token) {
        coinBalance.textContent = "0";
        return;
      }

      try {
        const response = await fetch("/api/account/wallet", {
          headers: { Authorization: "Bearer " + session.access_token },
          cache: "no-store"
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Не удалось загрузить баланс");
        }

        coinBalance.textContent =
          Number(result.balance || 0).toLocaleString("ru-RU");
      } catch (error) {
        console.error("Ошибка загрузки баланса монет:", error);
        coinBalance.textContent = "—";
      }
    }

    async function updateAccountDisplay() {
      try {
        if (!authClient) {
          console.error("Библиотека Supabase не загрузилась.");
          return;
        }

        const { data, error } = await authClient.auth.getSession();
        if (error) throw error;

        const session = data.session;

        if (!session) {
          accountWrap.hidden = true;
          accountPanel.hidden = true;
          profileButton.setAttribute("aria-expanded", "false");
          loginLink.hidden = false;
          coinBalance.textContent = "0";
          return;
        }

        const user = session.user;
        let nickname = user.user_metadata?.nickname || "";

        const { data: profile, error: profileError } = await authClient
          .from("user_profiles")
          .select("nickname")
          .eq("id", user.id)
          .maybeSingle();

        if (!profileError && profile?.nickname) {
          nickname = profile.nickname;
        }

        accountNickname.textContent = nickname || "Пользователь";
        accountEmail.textContent = user.email || "";

        profileDetails.textContent =
          "Никнейм: " + (nickname || "Пользователь") +
          (user.email ? "\nEmail: " + user.email : "");

        profileDetails.style.whiteSpace = "pre-line";

        try {
          const followersResponse = await fetch(
            "/api/follows/" + encodeURIComponent(user.id),
            {
              headers: {
                Authorization: "Bearer " + session.access_token
              },
              cache: "no-store"
            }
          );
          const followersResult = await followersResponse.json();

          if (followersResponse.ok) {
            profileDetails.textContent +=
              "\nПодписчики: " +
              Number(followersResult.followersCount || 0).toLocaleString("ru-RU");
          }
        } catch (followersError) {
          console.error("Не удалось загрузить подписчиков профиля:", followersError);
        }

        accountWrap.hidden = false;
        loginLink.hidden = true;

        await loadAccountBalance(session);
      } catch (error) {
        console.error("Ошибка отображения аккаунта:", error);
      }
    }

    profileButton.addEventListener("click", () => {
      const opening = accountPanel.hidden;
      accountPanel.hidden = !opening;
      profileButton.setAttribute("aria-expanded", String(opening));
    });

    document.addEventListener("click", event => {
      if (!event.target.closest("#accountWrap")) {
        accountPanel.hidden = true;
        profileButton.setAttribute("aria-expanded", "false");
      }
    });

    topupButton.addEventListener("click", () => {
      location.href = "/coins.html";
    });

    profileDetailsButton.addEventListener("click", () => {
      profileDetails.hidden = !profileDetails.hidden;
      profileDetailsButton.textContent = profileDetails.hidden
        ? "Мой профиль"
        : "Скрыть профиль";
    });

    logoutButton.addEventListener("click", async () => {
      if (!authClient) return;

      logoutButton.disabled = true;

      try {
        const { error } = await authClient.auth.signOut();

        if (error) {
          alert("Не удалось выйти из аккаунта. Попробуй ещё раз.");
          return;
        }

        location.reload();
      } catch (error) {
        console.error("Ошибка выхода:", error);
        alert("Не удалось выйти из аккаунта. Попробуй ещё раз.");
      } finally {
        logoutButton.disabled = false;
      }
    });

    if (authClient) {
      authClient.auth.onAuthStateChange(() => {
        updateAccountDisplay();
      });
    }

    updateAccountDisplay();

    // Фильтр стран и сортировка топа
    const countryButton = document.getElementById("countryButton");
    const countryMenu = document.getElementById("countryMenu");
    const streamsContainer = document.getElementById("streams");
    const topStreamsButton = document.getElementById("topStreamsButton");

    let selectedCountry = "all";
    let allStreams = [];
    let topStreamsEnabled = false;

    function getViewerCount(stream) {
      const fields = [
        "viewer_count",
        "viewerCount",
        "viewers",
        "num_viewers",
        "participant_count",
        "participantCount",
        "numParticipants",
        "audience_count",
        "audience"
      ];

      for (const field of fields) {
        const value = stream[field];

        if (value !== null && value !== undefined && value !== "") {
          const count = Number(value);
          if (Number.isFinite(count) && count >= 0) return count;
        }
      }

      return null;
    }

    topStreamsButton.addEventListener("click", () => {
      topStreamsEnabled = !topStreamsEnabled;
      topStreamsButton.classList.toggle("active", topStreamsEnabled);
      topStreamsButton.setAttribute("aria-pressed", String(topStreamsEnabled));
      renderStreams();
    });

    countryButton.addEventListener("click", () => {
      countryMenu.hidden = !countryMenu.hidden;
    });

    countryMenu.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        selectedCountry = button.dataset.country;

        countryButton.textContent =
          (selectedCountry === "all"
            ? "🌍 Все страны"
            : button.textContent.trim()) + " ▼";

        countryMenu.hidden = true;
        renderStreams();
      });
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".country-filter")) {
        countryMenu.hidden = true;
      }
    });

    // Список аккаунтов, на которые подписан пользователь
    const subscriptionsButton = document.getElementById("subscriptionsButton");
    const subscriptionsPanel = document.getElementById("subscriptionsPanel");
    const subscriptionsList = document.getElementById("subscriptionsList");
    let subscriptionsLoaded = false;
    let subscriptionsLoading = false;

    function renderSubscriptionMessage(message) {
      subscriptionsList.replaceChildren();
      const paragraph = document.createElement("p");
      paragraph.textContent = message;
      subscriptionsList.appendChild(paragraph);
    }

    async function loadSubscriptions(forceRefresh = false) {
      if (subscriptionsLoading) return;
      if (subscriptionsLoaded && !forceRefresh) return;

      if (!authClient) {
        renderSubscriptionMessage("Не удалось подключить авторизацию.");
        return;
      }

      subscriptionsLoading = true;
      renderSubscriptionMessage("Загружаем подписки…");

      try {
        const { data, error } = await authClient.auth.getSession();
        if (error) throw error;

        const session = data.session;

        if (!session) {
          subscriptionsLoaded = false;
          subscriptionsList.replaceChildren();

          const message = document.createElement("p");
          message.textContent = "Войди в аккаунт, чтобы посмотреть свои подписки.";

          const login = document.createElement("a");
          login.href = "/login.html";
          login.className = "watch-button";
          login.textContent = "Войти";

          subscriptionsList.append(message, login);
          return;
        }

        const response = await fetch(
          "/api/follows/me/list",
          {
            headers: { Authorization: "Bearer " + session.access_token },
            cache: "no-store"
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Не удалось загрузить подписки");
        }

        const users = Array.isArray(result)
          ? result
          : (result.users || result.follows || result.following || result.items || result.data || []);
        subscriptionsList.replaceChildren();

        if (!users.length) {
          renderSubscriptionMessage(
            "Ты пока ни на кого не подписан. Подписки появятся здесь."
          );
          subscriptionsLoaded = true;
          return;
        }

        users.forEach(user => {
          const item = document.createElement("div");
          item.className = "subscription-item";

          const name = document.createElement("div");
          name.className = "subscription-name";
          name.textContent = user.nickname || user.username || user.following_nickname || "Пользователь";

          const liveStream = allStreams.find(stream =>
            String(stream.host_id || stream.hostId || stream.user_id || "") ===
            String(user.userId || user.following_id || user.id || user.followingId || user.following_user_id)
          );

          if (liveStream && liveStream.room_name) {
            const link = document.createElement("a");
            link.className = "subscription-watch";
            link.href = "/live.html?room=" + encodeURIComponent(liveStream.room_name);
            link.textContent = "Смотреть эфир";
            item.append(name, link);
          } else {
            const status = document.createElement("span");
            status.className = "muted";
            status.textContent = "Не в эфире";
            item.append(name, status);
          }

          subscriptionsList.appendChild(item);
        });

        subscriptionsLoaded = true;
      } catch (error) {
        console.error("Ошибка загрузки подписок:", error);
        renderSubscriptionMessage(
          "Не удалось загрузить подписки. Проверь подключение и попробуй ещё раз."
        );
        subscriptionsLoaded = false;
      } finally {
        subscriptionsLoading = false;
      }
    }

    subscriptionsButton.addEventListener("click", async () => {
      const opening = subscriptionsPanel.hidden;
      subscriptionsPanel.hidden = !opening;
      subscriptionsButton.classList.toggle("active", opening);
      subscriptionsButton.setAttribute("aria-expanded", String(opening));

      if (opening) {
        await loadSubscriptions(true);
      }
    });

    // Подписка на ведущих: использует уже настроенные API server.js.
    const followStates = new Map();

    function getStreamHostId(stream) {
      return String(
        stream.host_id || stream.hostId || stream.user_id ||
        stream.userId || stream.profile_id || stream.profileId || ""
      );
    }

    async function loadFollowerCount(element, userId) {
      if (!userId) {
        element.hidden = true;
        return;
      }

      try {
        const response = await fetch(
          "/api/follows/" + encodeURIComponent(userId),
          { cache: "no-store" }
        );
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Не удалось загрузить подписчиков");
        }

        element.textContent =
          "👥 Подписчики: " +
          Number(result.followersCount || 0).toLocaleString("ru-RU");
        element.hidden = false;
      } catch (error) {
        console.error("Ошибка загрузки числа подписчиков:", error);
        element.textContent = "👥 Подписчики: —";
      }
    }

    async function refreshFollowerCounts(userId) {
      const elements = [
        ...document.querySelectorAll(".followers-count")
      ].filter(element => element.dataset.userId === userId);

      await Promise.all(
        elements.map(element => loadFollowerCount(element, userId))
      );
    }

    async function getCurrentSession() {
      if (!authClient) return null;
      const { data, error } = await authClient.auth.getSession();
      if (error) throw error;
      return data.session || null;
    }

    async function refreshFollowButton(button, hostId, session) {
      if (!hostId) {
        button.hidden = true;
        return;
      }

      if (!session?.access_token) {
        button.textContent = "❤️ Войти, чтобы подписаться";
        button.classList.remove("following");
        button.dataset.following = "false";
        button.disabled = false;
        return;
      }

      try {
        const response = await fetch("/api/follows/" + encodeURIComponent(hostId), {
          headers: { Authorization: "Bearer " + session.access_token },
          cache: "no-store"
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Не удалось проверить подписку");

        if (result.isOwnProfile) {
          button.hidden = true;
          return;
        }

        const following = Boolean(result.isFollowing);
        followStates.set(hostId, following);
        button.dataset.following = String(following);
        button.textContent = following ? "✓ Вы подписаны · Отписаться" : "❤️ Подписаться";
        button.classList.toggle("following", following);
        button.disabled = false;
      } catch (error) {
        console.error("Не удалось проверить подписку:", error);
        button.textContent = "❤️ Подписаться";
        button.dataset.following = "false";
        button.disabled = false;
      }
    }

    function createFollowButton(stream) {
      const hostId = getStreamHostId(stream);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "follow-button";
      button.textContent = "❤️ Проверяем подписку…";
      button.disabled = true;

      if (!hostId) {
        button.hidden = true;
        return button;
      }

      button.addEventListener("click", async () => {
        let session;
        try {
          session = await getCurrentSession();
        } catch (error) {
          console.error("Не удалось проверить аккаунт:", error);
          alert("Не удалось проверить вход в аккаунт. Обнови страницу и попробуй ещё раз.");
          return;
        }

        if (!session?.access_token) {
          location.href = "/login.html";
          return;
        }

        const wasFollowing = button.dataset.following === "true";
        button.disabled = true;
        button.textContent = wasFollowing ? "Отписываемся…" : "Подписываемся…";

        try {
          const response = await fetch("/api/follows/" + encodeURIComponent(hostId), {
            method: wasFollowing ? "DELETE" : "POST",
            headers: { Authorization: "Bearer " + session.access_token },
            cache: "no-store"
          });
          const result = await response.json();
          if (!response.ok || result.success === false) {
            throw new Error(result.error || "Не удалось изменить подписку");
          }

          const following = Boolean(result.isFollowing);
          followStates.set(hostId, following);
          button.dataset.following = String(following);
          button.textContent = following ? "✓ Вы подписаны · Отписаться" : "❤️ Подписаться";
          button.classList.toggle("following", following);
          await refreshFollowerCounts(hostId);

          // Если открыт список подписок, сразу обновляем его содержимое.
          if (!subscriptionsPanel.hidden) {
            await loadSubscriptions(true);
          }
        } catch (error) {
          console.error("Ошибка изменения подписки:", error);
          alert(error.message || "Не удалось изменить подписку. Попробуй ещё раз.");
          await refreshFollowButton(button, hostId, session);
        } finally {
          button.disabled = false;
        }
      });

      getCurrentSession()
        .then(session => refreshFollowButton(button, hostId, session))
        .catch(error => {
          console.error("Ошибка проверки подписки:", error);
          button.textContent = "❤️ Подписаться";
          button.disabled = false;
        });

      return button;
    }

    // LiveKit: подключения для видеопревью на карточках
    const previewConnections = new Map();

    function showPreviewPlaceholder(preview, placeholder) {
      preview.classList.remove("has-video");
      placeholder.hidden = false;
    }

    function attachPreviewTrack(state, track) {
      if (!state || !track || track.kind !== "video") return;

      try {
        if (state.track && state.track !== track && state.video) {
          state.track.detach(state.video);
        }

        state.track = track;

        track.attach(state.video);
        state.video.muted = true;
        state.video.autoplay = true;
        state.video.playsInline = true;

        const playResult = state.video.play();
        if (playResult && typeof playResult.catch === "function") {
          playResult.catch(() => {});
        }

        state.preview.classList.add("has-video");
        state.placeholder.hidden = true;
      } catch (error) {
        console.error("Не удалось показать видеопревью:", error);
        showPreviewPlaceholder(state.preview, state.placeholder);
      }
    }

    async function connectPreview(roomName, preview, video, placeholder) {
      let state = previewConnections.get(roomName);

      if (state) {
        // После перерисовки карточек подключение сохраняется,
        // но видеодорожка привязывается к новому элементу video.
        if (state.video !== video) {
          if (state.track && state.video) {
            try {
              state.track.detach(state.video);
            } catch (_) {}
          }

          state.preview = preview;
          state.video = video;
          state.placeholder = placeholder;

          if (state.track) {
            attachPreviewTrack(state, state.track);
          } else {
            showPreviewPlaceholder(preview, placeholder);
          }
        }

        return;
      }

      state = {
        roomName,
        preview,
        video,
        placeholder,
        room: null,
        track: null,
        connecting: true
      };

      previewConnections.set(roomName, state);

      try {
        if (!window.LivekitClient || !window.LivekitClient.Room) {
          throw new Error("Библиотека LiveKit не загрузилась");
        }

        const response = await fetch(
          "/api/livekit/token?roomName=" + encodeURIComponent(roomName),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Не удалось получить токен LiveKit");
        }

        const result = await response.json();
        const serverUrl = result.serverUrl || result.url;

        if (!result.token || !serverUrl) {
          throw new Error("Сервер не вернул токен или URL LiveKit");
        }

        // Карточка могла исчезнуть, пока загружался токен.
        if (previewConnections.get(roomName) !== state) return;

        const room = new window.LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true
        });

        state.room = room;

        room.on(
          window.LivekitClient.RoomEvent.TrackSubscribed,
          (track) => {
            if (track.kind === "video") {
              attachPreviewTrack(state, track);
            }
          }
        );

        room.on(
          window.LivekitClient.RoomEvent.TrackUnsubscribed,
          (track) => {
            if (track.kind === "video") {
              try {
                track.detach(state.video);
              } catch (_) {}

              if (state.track === track) {
                state.track = null;
                showPreviewPlaceholder(state.preview, state.placeholder);
              }
            }
          }
        );

        room.on(
          window.LivekitClient.RoomEvent.Disconnected,
          () => {
            state.track = null;
            showPreviewPlaceholder(state.preview, state.placeholder);
          }
        );

        await room.connect(serverUrl, result.token);

        if (previewConnections.get(roomName) !== state) {
          room.disconnect();
          return;
        }

        state.connecting = false;

        // На случай, если видеодорожка уже опубликована к моменту подключения.
        room.remoteParticipants.forEach(participant => {
          participant.trackPublications.forEach(publication => {
            if (publication.track && publication.track.kind === "video") {
              attachPreviewTrack(state, publication.track);
            }
          });
        });
      } catch (error) {
        state.connecting = false;
        console.error("Ошибка подключения превью:", roomName, error);
        showPreviewPlaceholder(state.preview, state.placeholder);
      }
    }

    function stopUnusedPreviewConnections(visibleRoomNames) {
      for (const [roomName, state] of previewConnections) {
        if (visibleRoomNames.has(roomName)) continue;

        previewConnections.delete(roomName);

        try {
          if (state.track && state.video) {
            state.track.detach(state.video);
          }
        } catch (_) {}

        try {
          state.room?.disconnect();
        } catch (_) {}
      }
    }

    function renderStreams() {
      streamsContainer.replaceChildren();

      let filteredStreams = allStreams.filter(stream => {
        if (selectedCountry === "all") return true;
        if (selectedCountry === "Другие") {
          return !["Украина", "Россия", "Польша", "Германия"].includes(stream.country);
        }
        return stream.country === selectedCountry;
      });

      if (topStreamsEnabled) {
        filteredStreams.sort((a, b) => {
          const viewersA = getViewerCount(a);
          const viewersB = getViewerCount(b);

          if (viewersA === null && viewersB === null) return 0;
          if (viewersA === null) return 1;
          if (viewersB === null) return -1;

          return viewersB - viewersA;
        });
      }

      if (!filteredStreams.length) {
        const empty = document.createElement("div");
        empty.className = "empty";

        empty.textContent = allStreams.length
          ? "В выбранной стране сейчас активных эфиров нет."
          : "Сейчас активных эфиров нет. Загляни позже!";

        streamsContainer.appendChild(empty);
        stopUnusedPreviewConnections(new Set());
        return;
      }

      const visibleRoomNames = new Set();

      filteredStreams.forEach(stream => {
        const card = document.createElement("article");
        card.className = "stream";

        const preview = document.createElement("div");
        preview.className = "preview";

        const video = document.createElement("video");
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("aria-label", "Предпросмотр прямого эфира");

        const placeholder = document.createElement("div");
        placeholder.className = "preview-placeholder";
        placeholder.textContent = "▶";
        placeholder.setAttribute("aria-hidden", "true");

        preview.append(video, placeholder);

        const status = document.createElement("p");
        status.className = "live";

        const viewerCount = getViewerCount(stream);

        status.textContent = viewerCount === null
          ? "● LIVE"
          : "● LIVE · " + viewerCount.toLocaleString("ru-RU") + " зрителей";

        const title = document.createElement("h2");
        title.textContent = stream.title || "Прямой эфир";

        const host = document.createElement("p");
        host.className = "muted";
        host.textContent =
          stream.host_name ||
          stream.profiles?.username ||
          "Ведущий";

        const followers = document.createElement("p");
        followers.className = "followers-count";
        followers.dataset.userId = getStreamHostId(stream);
        followers.textContent = "👥 Подписчики: …";
        loadFollowerCount(followers, followers.dataset.userId);

        const watchLink = document.createElement("a");
        watchLink.className = "watch-button";
        watchLink.href =
          "/live.html?room=" + encodeURIComponent(stream.room_name);
        watchLink.textContent = "Смотреть эфир";

        const followButton = createFollowButton(stream);

        card.append(
          preview,
          status,
          title,
          host,
          followers,
          watchLink,
          followButton
        );
        streamsContainer.appendChild(card);

        visibleRoomNames.add(stream.room_name);
        connectPreview(stream.room_name, preview, video, placeholder);
      });

      stopUnusedPreviewConnections(visibleRoomNames);
    }

    async function loadStreams() {
      try {
        const response = await fetch("/api/streams", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Не удалось загрузить эфиры");
        }

        const result = await response.json();
        const streams = Array.isArray(result)
          ? result
          : result.streams || [];

        allStreams = streams.filter(
          stream => stream.status === "live" && stream.room_name
        );

        renderStreams();
      } catch (error) {
        console.error("Ошибка загрузки эфиров:", error);

        const message = document.createElement("div");
        message.className = "empty";
        message.textContent =
          "Не удалось загрузить эфиры. Обнови страницу позже.";

        streamsContainer.replaceChildren(message);
      }
    }

    loadStreams();
    setInterval(loadStreams, 15000);
  </script>
</body>
