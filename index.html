<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Y-FETISH LIVE — Прямые эфиры</title>
  <meta name="description" content="Смотри прямые эфиры, общайся со зрителями и отправляй виртуальные подарки на Y-FETISH LIVE.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 18px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 25px;
      font-weight: bold;
    }
    .logo span { color: #f22; }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px;
    }
    h1 { font-size: 27px; }
    .muted { color: #aaa; }
    .streams {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }
    .stream {
      background: #202020;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
    }
    .preview {
      background: #292929;
      border-radius: 8px;
      min-height: 130px;
      display: grid;
      place-items: center;
      font-size: 40px;
    }
    .live {
      color: #ff4545;
      font-weight: bold;
    }
    button {
      background: #e51e2a;
      border: 0;
      border-radius: 7px;
      padding: 12px 16px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .empty {
      padding: 24px;
      background: #1b1b1b;
      border-radius: 10px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span>Y</span>-FETISH LIVE</div>
    <button class="menu-button" id="yfl-menu-button" aria-label="Открыть меню">☰</button>
  </header>

  <main>
    <h1>Прямые эфиры</h1>
    <p class="muted">Смотри трансляции и отправляй подарки ведущим.</p>
    <div id="streams" class="streams">
      <div class="empty">Загружаем эфиры...</div>
    </div>
  </main>

  <script>
    async function loadStreams() {
      const container = document.getElementById("streams");

      try {
        const response = await fetch("/api/streams");
        if (!response.ok) throw new Error("Не удалось загрузить эфиры");

        const streams = await response.json();

        if (!streams.length) {
          container.innerHTML =
            '<div class="empty">Сейчас активных эфиров нет. Загляни позже!</div>';
          return;
        }

        container.replaceChildren();

        streams.forEach((stream) => {
          const card = document.createElement("article");
          card.className = "stream";

          const preview = document.createElement("div");
          preview.className = "preview";
          preview.textContent = "▶";

          const status = document.createElement("p");
          status.className = "live";
          status.textContent = "● LIVE";

          const title = document.createElement("h2");
          title.textContent = stream.title;

          const host = document.createElement("p");
          host.className = "muted";
          host.textContent =
            stream.profiles?.username || "Ведущий";

          card.append(preview, status, title, host);
          container.appendChild(card);
        });
      } catch {
        container.innerHTML =
          '<div class="empty">Не удалось загрузить эфиры. Попробуй позже.</div>';
      }
    }

    loadStreams();
    setInterval(loadStreams, 15000);

  const menuButton = document.getElementById("yfl-menu-button");
  const menuPanel = document.getElementById("yfl-menu-panel");
  const menuOverlay = document.getElementById("yfl-menu-overlay");
  const menuClose = document.getElementById("yfl-menu-close");

  function openMenu() {
    menuPanel.classList.add("open");
    menuOverlay.classList.add("open");
    document.body.classList.add("menu-open");
  }

  function closeMenu() {
    menuPanel.classList.remove("open");
    menuOverlay.classList.remove("open");
    document.body.classList.remove("menu-open");
  }

  menuButton.addEventListener("click", openMenu);
  menuClose.addEventListener("click", closeMenu);
  menuOverlay.addEventListener("click", closeMenu);

  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") closeMenu();
  });
</script>
</body>
</html>
