<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">

  <title>Y-FETISH LIVE — Прямые эфиры</title>
  <meta name="description" content="Смотри прямые эфиры Y-FETISH LIVE, общайся со зрителями и отправляй виртуальные подарки ведущим.">
  <link rel="canonical" href="https://y-fetish-live.onrender.com/">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 14px 18px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Новый логотип */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0;
      font-family: "Arial Rounded MT Bold", Arial, sans-serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .logo-y {
      color: #ff3038;
      font-weight: 900;
    }

    .logo-name {
      color: #fff;
      font-weight: 900;
    }

    .logo-live {
      margin-left: 7px;
      padding: 4px 8px;
      border-radius: 7px;
      background: #ff3038;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-title {
      color: #ddd;
    }

    .start-live,
    .login-button {
      display: inline-block;
      padding: 12px 16px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 7px;
      white-space: nowrap;
      text-align: center;
    }

    .start-live {
      background: #e5222e;
    }

    .start-live:hover {
      background: #c91824;
    }

    .login-button {
      background: #303030;
      border: 1px solid #555;
    }

    .login-button:hover {
      background: #444;
    }

    .account-wrap {
      position: relative;
    }

    .profile-circle {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid #555;
      background: #292929;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .profile-circle:hover,
    .profile-circle[aria-expanded="true"] {
      background: #3a3a3a;
      border-color: #e5222e;
    }

    .account-panel {
      position: absolute;
      z-index: 1200;
      top: calc(100% + 10px);
      right: 0;
      width: min(290px, calc(100vw - 24px));
      padding: 18px;
      background: #1c1c1c;
      border: 1px solid #414141;
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .55);
      color: #fff;
    }

    .account-panel-title {
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .account-nickname {
      font-size: 18px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .account-email {
      color: #aaa;
      font-size: 12px;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .coin-balance {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 16px 0 12px;
      padding: 12px;
      background: #292929;
      border-radius: 10px;
      font-weight: bold;
    }

    #coinBalance {
      font-size: 20px;
      color: #ffd45c;
    }

    .panel-button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 11px 12px;
      border: 1px solid #414141;
      border-radius: 9px;
      background: #292929;
      color: #fff;
      text-align: left;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }

    .panel-button:hover {
      background: #383838;
    }

    .topup-button {
      background: #e5222e;
      border-color: #e5222e;
      text-align: center;
    }

    .topup-button:hover {
      background: #c91824;
    }

    .logout-panel-button {
      color: #ff7777;
    }

    .profile-details {
      padding: 10px;
      margin-top: 8px;
      background: #111;
      border-radius: 8px;
      color: #ccc;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 27px;
    }

    .muted {
      color: #aaa;
      line-height: 1.5;
    }

    .streams {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }

    .stream {
      min-width: 0;
      background: #202020;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      overflow: hidden;
    }

    .preview {
      background: #090909;
      border-radius: 8px;
      min-height: 150px;
      display: grid;
      place-items: center;
      font-size: 42px;
      color: #e5222e;
    }

    .live {
      color: #ff4545;
      font-weight: bold;
      font-size: 13px;
    }

    .stream h2 {
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 24px;
      background: #1b1b1b;
      border-radius: 10px;
      color: #bbb;
      grid-column: 1 / -1;
      line-height: 1.5;
    }

    .watch-button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border-radius: 8px;
      background: #e5222e;
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .watch-button:hover {
      background: #c91824;
    }

    footer {
      padding: 20px 16px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .country-filter {
      position: relative;
      margin: 16px 0;
    }

    #countryButton {
      background: #202020;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    #countryMenu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 999;
      min-width: 190px;
      padding: 6px;
      background: #151515;
      border: 1px solid #444;
      border-radius: 10px;
    }

    #countryMenu button {
      display: block;
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    #countryMenu button:hover {
      background: #303030;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px;
      }

      .logo {
        font-size: 21px;
      }

      .logo-live {
        font-size: 12px;
        padding: 3px 6px;
        margin-left: 5px;
      }

      .header-right {
        gap: 7px;
      }

      .header-title {
        display: none;
      }

      .profile-circle {
        width: 38px;
        height: 38px;
        font-size: 18px;
      }

      .start-live,
      .login-button {
        padding: 10px 11px;
        font-size: 12px;
      }

      main {
        padding: 18px 12px;
      }

      h1 {
        font-size: 24px;
      }

      .streams {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .preview {
        min-height: 170px;
      }
    }

    @media (max-width: 370px) {
      header {
        gap: 8px;
      }

      .logo {
        font-size: 19px;
      }

      .logo-live {
        font-size: 11px;
        padding: 3px 5px;
        margin-left: 4px;
      }

      .header-right {
        gap: 5px;
      }

      .start-live,
      .login-button {
        padding: 9px 8px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <span class="logo-y">Y</span><span class="logo-name">-FETISH</span><span class="logo-live">LIVE</span>
    </div>

    <div class="header-right">
      <div class="header-title">Прямые эфиры</div>

      <a class="login-button" id="loginLink" href="/login.html">Войти</a>

      <div class="account-wrap" id="accountWrap" hidden>
        <button
          class="profile-circle"
          id="profileButton"
          type="button"
          aria-label="Открыть аккаунт"
          aria-expanded="false"
          aria-controls="accountPanel"
        >👤</button>

        <section class="account-panel" id="accountPanel" hidden>
          <div class="account-panel-title">Мой аккаунт</div>
          <div class="account-nickname" id="accountNickname">Пользователь</div>
          <div class="account-email" id="accountEmail"></div>

          <div class="coin-balance">
            <span>🪙</span>
            <span id="coinBalance">0</span>
            <span>монет</span>
          </div>

          <button class="panel-button topup-button" id="topupButton" type="button">
            ＋ Пополнить
          </button>

          <button class="panel-button" id="profileDetailsButton" type="button">
            Мой профиль
          </button>

          <div class="profile-details" id="profileDetails" hidden></div>

          <a class="panel-button panel-link" href="/host.html">Мои эфиры</a>

          <button class="panel-button logout-panel-button" id="logoutButton" type="button">
            Выйти
          </button>
        </section>
      </div>

      <a class="start-live" href="/host.html">Начать эфир</a>
    </div>
  </header>

  <main>
    <h1>Прямые эфиры</h1>

    <p class="muted">
      Смотри прямые эфиры, общайся со зрителями и отправляй подарки ведущим.
    </p>

    <div class="country-filter">
      <button id="countryButton" type="button">🌍 Все страны ▼</button>

      <div id="countryMenu" hidden>
        <button type="button" data-country="all">🌐 Все страны</button>
        <button type="button" data-country="Украина">🇺🇦 Украина</button>
        <button type="button" data-country="Россия">🇷🇺 Россия</button>
        <button type="button" data-country="Польша">🇵🇱 Польша</button>
        <button type="button" data-country="Германия">🇩🇪 Германия</button>
        <button type="button" data-country="Другие">🌐 Другие</button>
      </div>
    </div>

    <div id="streams" class="streams" aria-live="polite">
      <div class="empty">Загружаем эфиры...</div>
    </div>
  </main>

  <footer>
    Y-FETISH LIVE — прямые эфиры
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // Авторизация и отображение аккаунта
    const SUPABASE_URL = "https://cdyuxiicllnfrwssigsr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VuAtnZ0pGWc4BOsYTLBfeA_1Mb86lw0";

    const loginLink = document.getElementById("loginLink");
    const accountWrap = document.getElementById("accountWrap");
    const profileButton = document.getElementById("profileButton");
    const accountPanel = document.getElementById("accountPanel");
    const accountNickname = document.getElementById("accountNickname");
    const accountEmail = document.getElementById("accountEmail");
    const coinBalance = document.getElementById("coinBalance");
    const logoutButton = document.getElementById("logoutButton");
    const topupButton = document.getElementById("topupButton");
    const profileDetailsButton = document.getElementById("profileDetailsButton");
    const profileDetails = document.getElementById("profileDetails");

    const authClient = window.supabase?.createClient
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    async function loadAccountBalance(session) {
      if (!session?.access_token) {
        coinBalance.textContent = "0";
        return;
      }

      try {
        const response = await fetch("/api/account/wallet", {
          headers: {
            Authorization: "Bearer " + session.access_token
          },
          cache: "no-store"
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Не удалось загрузить баланс");
        }

        coinBalance.textContent =
          Number(result.balance || 0).toLocaleString("ru-RU");
      } catch (error) {
        console.error("Ошибка загрузки баланса монет:", error);
        coinBalance.textContent = "—";
      }
    }

    async function updateAccountDisplay() {
      try {
        if (!authClient) {
          console.error("Библиотека Supabase не загрузилась.");
          return;
        }

        const { data, error } = await authClient.auth.getSession();

        if (error) throw error;

        const session = data.session;

        if (!session) {
          accountWrap.hidden = true;
          accountPanel.hidden = true;
          profileButton.setAttribute("aria-expanded", "false");
          loginLink.hidden = false;
          coinBalance.textContent = "0";
          return;
        }

        const user = session.user;
        let nickname = user.user_metadata?.nickname || "";

        const { data: profile, error: profileError } = await authClient
          .from("user_profiles")
          .select("nickname")
          .eq("id", user.id)
          .maybeSingle();

        if (!profileError && profile?.nickname) {
          nickname = profile.nickname;
        }

        accountNickname.textContent = nickname || "Пользователь";
        accountEmail.textContent = user.email || "";

        profileDetails.textContent =
          "Никнейм: " + (nickname || "Пользователь") +
          (user.email ? "\nEmail: " + user.email : "");

        profileDetails.style.whiteSpace = "pre-line";

        accountWrap.hidden = false;
        loginLink.hidden = true;

        await loadAccountBalance(session);
      } catch (error) {
        console.error("Ошибка отображения аккаунта:", error);
      }
    }

    profileButton.addEventListener("click", () => {
      const opening = accountPanel.hidden;
      accountPanel.hidden = !opening;
      profileButton.setAttribute("aria-expanded", String(opening));
    });

    document.addEventListener("click", event => {
      if (!event.target.closest("#accountWrap")) {
        accountPanel.hidden = true;
        profileButton.setAttribute("aria-expanded", "false");
      }
    });

    topupButton.addEventListener("click", () => {
      alert("Пополнение монет пока не подключено.");
    });

    profileDetailsButton.addEventListener("click", () => {
      profileDetails.hidden = !profileDetails.hidden;

      profileDetailsButton.textContent = profileDetails.hidden
        ? "Мой профиль"
        : "Скрыть профиль";
    });

    logoutButton.addEventListener("click", async () => {
      if (!authClient) return;

      logoutButton.disabled = true;

      try {
        const { error } = await authClient.auth.signOut();

        if (error) {
          alert("Не удалось выйти из аккаунта. Попробуй ещё раз.");
          return;
        }

        location.reload();
      } catch (error) {
        console.error("Ошибка выхода:", error);
        alert("Не удалось выйти из аккаунта. Попробуй ещё раз.");
      } finally {
        logoutButton.disabled = false;
      }
    });

    if (authClient) {
      authClient.auth.onAuthStateChange(() => {
        updateAccountDisplay();
      });
    }

    updateAccountDisplay();

    // Фильтр стран и загрузка эфиров — сохранены
    const countryButton = document.getElementById("countryButton");
    const countryMenu = document.getElementById("countryMenu");
    const streamsContainer = document.getElementById("streams");

    let selectedCountry = "all";
    let allStreams = [];

    countryButton.addEventListener("click", () => {
      countryMenu.hidden = !countryMenu.hidden;
    });

    countryMenu.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        selectedCountry = button.dataset.country;

        countryButton.textContent =
          (selectedCountry === "all"
            ? "🌍 Все страны"
            : button.textContent.trim()) + " ▼";

        countryMenu.hidden = true;
        renderStreams();
      });
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".country-filter")) {
        countryMenu.hidden = true;
      }
    });

    function renderStreams() {
      streamsContainer.replaceChildren();

      const filteredStreams = allStreams.filter(stream => {
        if (selectedCountry === "all") {
          return true;
        }

        return stream.country === selectedCountry;
      });

      if (!filteredStreams.length) {
        const empty = document.createElement("div");
        empty.className = "empty";

        empty.textContent = allStreams.length
          ? "В выбранной стране сейчас активных эфиров нет."
          : "Сейчас активных эфиров нет. Загляни позже!";

        streamsContainer.appendChild(empty);
        return;
      }

      filteredStreams.forEach(stream => {
        const card = document.createElement("article");
        card.className = "stream";

        const preview = document.createElement("div");
        preview.className = "preview";
        preview.textContent = "▶";
        preview.setAttribute("aria-hidden", "true");

        const status = document.createElement("p");
        status.className = "live";
        status.textContent = "● LIVE";

        const title = document.createElement("h2");
        title.textContent = stream.title || "Прямой эфир";

        const host = document.createElement("p");
        host.className = "muted";
        host.textContent =
          stream.host_name ||
          stream.profiles?.username ||
          "Ведущий";

        const watchLink = document.createElement("a");
        watchLink.className = "watch-button";
        watchLink.href =
          "/live.html?room=" +
          encodeURIComponent(stream.room_name);
        watchLink.textContent = "Смотреть эфир";

        card.append(
          preview,
          status,
          title,
          host,
          watchLink
        );

        streamsContainer.appendChild(card);
      });
    }

    async function loadStreams() {
      try {
        const response = await fetch("/api/streams", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Не удалось загрузить эфиры");
        }

        const result = await response.json();
        const streams = Array.isArray(result)
          ? result
          : result.streams || [];

        allStreams = streams.filter(
          stream => stream.status === "live" && stream.room_name
        );

        renderStreams();
      } catch (error) {
        console.error("Ошибка загрузки эфиров:", error);

        const message = document.createElement("div");
        message.className = "empty";
        message.textContent =
          "Не удалось загрузить эфиры. Обнови страницу позже.";

        streamsContainer.replaceChildren(message);
      }
    }

    loadStreams();
    setInterval(loadStreams, 15000);
  </script>
</body>
</html>
