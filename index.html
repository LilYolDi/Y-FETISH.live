<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">

  <title>Y-FETISH LIVE — Прямые эфиры</title>
  <meta name="description" content="Смотри прямые эфиры Y-FETISH LIVE, общайся со зрителями и отправляй виртуальные подарки ведущим.">

  <link rel="canonical" href="https://y-fetish-live.onrender.com/">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 14px 18px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      white-space: nowrap;
    }

    .logo span {
      color: #f22;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-title {
      color: #ddd;
    }

    .start-live {
      display: inline-block;
      padding: 12px 16px;
      background: #e5222e;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 7px;
      white-space: nowrap;
      text-align: center;
    }

    .start-live:hover {
      background: #c91824;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 27px;
    }

    .muted {
      color: #aaa;
      line-height: 1.5;
    }

    .streams {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }

    .stream {
      min-width: 0;
      background: #202020;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      overflow: hidden;
    }

    .preview {
      background: #090909;
      border-radius: 8px;
      min-height: 150px;
      display: grid;
      place-items: center;
      font-size: 42px;
      color: #e5222e;
    }

    .live {
      color: #ff4545;
      font-weight: bold;
      font-size: 13px;
    }

    .stream h2 {
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 24px;
      background: #1b1b1b;
      border-radius: 10px;
      color: #bbb;
      grid-column: 1 / -1;
      line-height: 1.5;
    }

    .watch-button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border-radius: 8px;
      background: #e5222e;
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .watch-button:hover {
      background: #c91824;
    }

    footer {
      padding: 20px 16px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px;
      }

      .logo {
        font-size: 21px;
      }

      .header-right {
        gap: 10px;
      }

      .header-title {
        display: none;
      }

      .start-live {
        padding: 10px 12px;
        font-size: 13px;
      }

      main {
        padding: 18px 12px;
      }

      h1 {
        font-size: 24px;
      }

      .streams {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .preview {
        min-height: 170px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo"><span>Y</span>-FETISH LIVE</div>

    <div class="header-right">
      <div class="header-title">Прямые эфиры</div>
      <a class="start-live" href="/host.html">Начать эфир</a>
    </div>
  </header>

  <main>
    <h1>Прямые эфиры</h1>

    <p class="muted">
      Смотри прямые эфиры, общайся со зрителями и отправляй подарки ведущим.
    </p>

    <div id="streams" class="streams" aria-live="polite">
      <div class="empty">Загружаем эфиры...</div>
    </div>
  </main>

  <footer>
    Y-FETISH LIVE — прямые эфиры
  </footer>

  <script>
    "use strict";

    async function loadStreams() {
      const container = document.getElementById("streams");

      try {
        const response = await fetch("/api/streams", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Не удалось загрузить эфиры");
        }

        const result = await response.json();
        const streams = Array.isArray(result)
          ? result
          : result.streams || [];

        const activeStreams = streams.filter(
          stream => stream.status === "live" && stream.room_name
        );

        if (!activeStreams.length) {
          container.replaceChildren();

          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent =
            "Сейчас активных эфиров нет. Загляни позже!";

          container.appendChild(empty);
          return;
        }

        container.replaceChildren();

        activeStreams.forEach(stream => {
          const card = document.createElement("article");
          card.className = "stream";

          const preview = document.createElement("div");
          preview.className = "preview";
          preview.textContent = "▶";
          preview.setAttribute("aria-hidden", "true");

          const status = document.createElement("p");
          status.className = "live";
          status.textContent = "● LIVE";

          const title = document.createElement("h2");
          title.textContent = stream.title || "Прямой эфир";

          const host = document.createElement("p");
          host.className = "muted";
          host.textContent =
            stream.host_name ||
            stream.profiles?.username ||
            "Ведущий";

          const watchLink = document.createElement("a");
          watchLink.className = "watch-button";
          watchLink.href =
            "/live.html?room=" +
            encodeURIComponent(stream.room_name);
          watchLink.textContent = "Смотреть эфир";

          card.append(
            preview,
            status,
            title,
            host,
            watchLink
          );

          container.appendChild(card);
        });
      } catch (error) {
        console.error("Ошибка загрузки эфиров:", error);

        const message = document.createElement("div");
        message.className = "empty";
        message.textContent =
          "Не удалось загрузить эфиры. Обнови страницу позже.";

        container.replaceChildren(message);
      }
    }

    loadStreams();
    setInterval(loadStreams, 15000);
  </script>
</body>
</html>
