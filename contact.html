
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>Y-FETISH LIVE — Telegram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0d;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contact-page {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      margin-bottom: 38px;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo-y {
      color: #ff3038;
    }

    .logo-name {
      color: #fff;
    }

    .live {
      margin-left: 9px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #ff3038;
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .card {
      padding: 34px 24px;
      background: #141416;
      border: 1px solid #29292d;
      border-radius: 20px;
      box-shadow: 0 12px 45px rgba(255, 48, 56, 0.08);
    }

    .telegram-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #229ed9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 27px;
      font-weight: 800;
    }

    .description {
      margin: 0 0 28px;
      color: #aaaab2;
      font-size: 15px;
      line-height: 1.7;
    }

    .telegram-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 15px;
      border-radius: 12px;
      background: #229ed9;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      transition: background 0.2s, transform 0.2s;
    }

    .telegram-button:hover {
      background: #168ac2;
      transform: translateY(-2px);
    }

    .telegram-button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 22px;
      color: #77777f;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      .logo {
        font-size: 27px;
      }

      .card {
        padding: 28px 18px;
      }

      h1 {
        font-size: 24px;
      }

      .telegram-button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="contact-page">

    <div class="logo">
      <span class="logo-y">Y</span><span class="logo-name">-FETISH</span>
      <span class="live">LIVE</span>
    </div>

    <section class="card">
      <div class="telegram-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24"
             fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.8 4.2 18.5 20c-.25 1.12-.9 1.4-1.83.88l-5.05-3.72-2.44 2.35c-.27.27-.5.5-1.02.5l.36-5.13 9.34-8.43c.4-.36-.09-.56-.62-.2L5.7 13.5.72 11.94c-1.08-.34-1.1-1.08.23-1.6L20.4 2.8c.9-.33 1.68.22 1.4 1.4Z"/>
        </svg>
      </div>

      <h1>Есть вопросы?</h1>

      <p class="description">
        Напишите администратору Y-FETISH LIVE
        в Telegram. Поможем с аккаунтом,
        монетами, трансляциями и другими вопросами.
      </p>

      <!-- ЗАМЕНИ LilYolDi НА СВОЙ TELEGRAM USERNAME -->
      <a
        class="telegram-button"
        href="https://t.me/LilYolDi"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>✈</span>
        Написать администратору
      </a>

      <p class="note">
        Вы перейдёте в Telegram для общения
        с администратором сайта.
      </p>
    </section>

  </main>
</body>
</html>
