<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">

  <title>Вход и регистрация — Y-FETISH LIVE</title>
  <meta name="description" content="Вход и регистрация пользователей Y-FETISH LIVE.">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 16px;
    }

    /* Логотип Y-FETISH LIVE */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin: 0 0 8px;
      text-align: center;
      font-family: "Arial Rounded MT Bold", Arial, sans-serif;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .logo .y {
      color: #ff3038;
      font-weight: 900;
    }

    .logo .fetish {
      color: #fff;
      font-weight: 900;
    }

    .logo .live {
      display: inline-block;
      margin-left: 7px;
      padding: 4px 8px;
      border-radius: 7px;
      background: #ff3038;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    button, input { font: inherit; }

    .tabs button {
      flex: 1;
      padding: 12px 8px;
      color: #ddd;
      background: #242424;
      border: 1px solid #383838;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs button.active {
      color: #fff;
      background: #b9002a;
      border-color: #ff1744;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 13px;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      color: #fff;
      background: #090909;
      border: 1px solid #393939;
      border-radius: 8px;
      outline: none;
    }

    input:focus { border-color: #ff1744; }

    .hint {
      margin: 6px 0 0;
      color: #999;
      font-size: 12px;
      line-height: 1.4;
    }

    .primary {
      width: 100%;
      min-height: 46px;
      margin-top: 5px;
      padding: 12px;
      color: white;
      background: #e60035;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: .55;
      cursor: wait;
    }

    .secondary {
      display: block;
      margin: 16px auto 0;
      padding: 5px;
      color: #ff6684;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #242424;
      color: #eee;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }

    .back {
      display: block;
      margin-top: 20px;
      color: #aaa;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover { color: #fff; }

    [hidden] { display: none !important; }

    @media (max-width: 380px) {
      .logo { font-size: 25px; }

      .logo .live {
        margin-left: 5px;
        padding: 3px 6px;
        font-size: 12px;
      }

      .card { padding: 25px 17px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 class="logo">
      <span class="y">Y</span><span class="fetish">-FETISH</span><span class="live">LIVE</span>
    </h1>

    <p class="subtitle">Твой аккаунт и твои эфиры</p>

    <div class="tabs" id="tabs">
      <button type="button" id="loginTab" class="active">Войти</button>
      <button type="button" id="registerTab">Регистрация</button>
    </div>

    <form id="authForm">
      <div class="field" id="nicknameField" hidden>
        <label for="registerNickname">Твой ник</label>
        <input
          type="text"
          id="registerNickname"
          minlength="3"
          maxlength="24"
          pattern="[A-Za-z0-9_]+"
          autocomplete="nickname"
          placeholder="Например, My_Nick"
          spellcheck="false"
        >
        <p class="hint">
          3–24 символа: латинские буквы, цифры и знак _.
          Ник должен быть уникальным.
        </p>
      </div>

      <div class="field">
        <label for="email">Электронная почта</label>
        <input
          type="email"
          id="email"
          autocomplete="email"
          placeholder="name@example.com"
          required
        >
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          minlength="6"
          autocomplete="current-password"
          placeholder="Минимум 6 символов"
          required
        >
      </div>

      <button class="primary" id="submitButton" type="submit">Войти</button>
    </form>

    <button type="button" class="secondary" id="forgotButton">
      Забыли пароль?
    </button>

    <form id="recoveryForm" hidden>
      <div class="field">
        <label for="recoveryEmail">Электронная почта аккаунта</label>
        <input
          type="email"
          id="recoveryEmail"
          autocomplete="email"
          placeholder="name@example.com"
          required
        >
      </div>
      <button class="primary" type="submit" id="recoveryButton">
        Отправить ссылку восстановления
      </button>
      <button type="button" class="secondary" id="backButton">Назад</button>
    </form>

    <form id="resetForm" hidden>
      <div class="field">
        <label for="newPassword">Новый пароль</label>
        <input
          type="password"
          id="newPassword"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>
      <button class="primary" type="submit" id="resetButton">
        Сохранить новый пароль
      </button>
    </form>

    <div class="message" id="message" role="status" aria-live="polite"></div>
    <a class="back" href="/">← Вернуться на главную</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);

    let mode = "login";
    let busy = false;
    let supabaseClient = null;

    function showMessage(text) {
      $("message").textContent = text;
      $("message").classList.add("show");
    }

    function clearMessage() {
      $("message").textContent = "";
      $("message").classList.remove("show");
    }

    function setBusy(value) {
      busy = value;
      $("submitButton").disabled = value;
      $("recoveryButton").disabled = value;
      $("resetButton").disabled = value;
    }

    function setMode(nextMode) {
      mode = nextMode;
      clearMessage();

      $("authForm").hidden = false;
      $("recoveryForm").hidden = true;
      $("resetForm").hidden = true;
      $("tabs").hidden = false;
      $("forgotButton").hidden = false;

      const registering = mode === "register";

      $("nicknameField").hidden = !registering;
      $("registerNickname").required = registering;
      $("password").autocomplete =
        registering ? "new-password" : "current-password";

      $("loginTab").classList.toggle("active", !registering);
      $("registerTab").classList.toggle("active", registering);

      $("submitButton").textContent =
        registering ? "Создать аккаунт" : "Войти";

      $("forgotButton").hidden = registering;
    }

    $("loginTab").addEventListener("click", () => setMode("login"));
    $("registerTab").addEventListener("click", () => setMode("register"));

    $("forgotButton").addEventListener("click", () => {
      clearMessage();
      $("authForm").hidden = true;
      $("tabs").hidden = true;
      $("forgotButton").hidden = true;
      $("recoveryForm").hidden = false;
      $("recoveryEmail").value = $("email").value.trim();
    });

    $("backButton").addEventListener("click", () => setMode("login"));

    function friendlyError(error) {
      const text = String(error?.message || "");
      const details = String(error?.details || "");
      const combined = text + " " + details;

      if (
        /user_profiles_nickname_lower_unique|user_profiles_nickname_key|duplicate key|unique constraint|23505/i.test(combined)
      ) {
        return "Этот ник уже занят. Придумай другой.";
      }

      if (/invalid login credentials/i.test(text)) {
        return "Неверная почта или пароль.";
      }

      if (/email not confirmed/i.test(text)) {
        return "Подтверди электронную почту по ссылке из письма.";
      }

      if (/user already registered/i.test(text)) {
        return "Этот email уже зарегистрирован. Попробуй войти.";
      }

      return text || "Произошла ошибка. Попробуй ещё раз.";
    }

    async function requireSupabase() {
      if (supabaseClient) return supabaseClient;

      if (!window.supabase || !window.supabase.createClient) {
        throw new Error(
          "Не загрузился модуль авторизации. Обнови страницу и попробуй ещё раз."
        );
      }

      supabaseClient = window.supabase.createClient(
        "https://cdyuxiicllnfrwssigsr.supabase.co",
        "sb_publishable_VuAtnZ0pGWc4BOsYTLBfeA_1Mb86lw0"
      );

      return supabaseClient;
    }

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      clearMessage();
      setBusy(true);

      const email = $("email").value.trim();
      const password = $("password").value;
      const nickname = $("registerNickname").value.trim();

      try {
        const client = await requireSupabase();

        if (mode === "register") {
          if (!/^[A-Za-z0-9_]{3,24}$/.test(nickname)) {
            throw new Error(
              "Ник: 3–24 символа, только латинские буквы, цифры и _."
            );
          }

          const { data: existing, error: checkError } = await client
            .from("user_profiles")
            .select("id")
            .ilike("nickname", nickname)
            .limit(1);

          if (checkError) {
            throw new Error(
              "Не удалось проверить ник. Проверь доступ к таблице user_profiles в Supabase."
            );
          }

          if (existing && existing.length > 0) {
            throw new Error("Этот ник уже занят. Придумай другой.");
          }

          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              data: { nickname },
              emailRedirectTo: location.origin + "/login.html"
            }
          });

          if (error) throw error;

          if (data.session) {
            location.replace("/");
            return;
          }

          showMessage(
            "Аккаунт создан. Проверь почту и подтверди регистрацию, затем войди."
          );
        } else {
          const { data, error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          if (!data.session) {
            throw new Error("Не удалось создать сессию. Попробуй ещё раз.");
          }

          location.replace("/");
          return;
        }
      } catch (error) {
        showMessage(friendlyError(error));
      } finally {
        setBusy(false);
      }
    });

    $("recoveryForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      clearMessage();
      setBusy(true);

      try {
        const client = await requireSupabase();
        const email = $("recoveryEmail").value.trim();

        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: location.origin + "/login.html"
        });

        if (error) throw error;

        showMessage(
          "Если для этой почты существует аккаунт, инструкция по восстановлению будет отправлена на неё."
        );
      } catch (error) {
        showMessage(friendlyError(error));
      } finally {
        setBusy(false);
      }
    });

    $("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      clearMessage();
      setBusy(true);

      try {
        const client = await requireSupabase();
        const newPassword = $("newPassword").value;

        if (newPassword.length < 6) {
          throw new Error("Пароль должен содержать минимум 6 символов.");
        }

        const { error } = await client.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        $("resetForm").hidden = true;
        $("tabs").hidden = false;
        setMode("login");
        showMessage("Пароль изменён. Теперь можешь войти.");
      } catch (error) {
        showMessage(friendlyError(error));
      } finally {
        setBusy(false);
      }
    });

    async function initializePage() {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const query = new URLSearchParams(location.search);

      const recovery =
        hash.get("type") === "recovery" ||
        query.get("type") === "recovery";

      if (recovery) {
        $("authForm").hidden = true;
        $("tabs").hidden = true;
        $("forgotButton").hidden = true;
        $("recoveryForm").hidden = true;
        $("resetForm").hidden = false;

        try {
          const client = await requireSupabase();
          const { error } = await client.auth.getSession();

          if (error) {
            showMessage(
              "Не удалось проверить сессию восстановления. Запроси новую ссылку."
            );
          }
        } catch (error) {
          showMessage(friendlyError(error));
        }

        return;
      }

      try {
        const client = await requireSupabase();
        const { data, error } = await client.auth.getSession();

        if (error) {
          showMessage("Не удалось проверить вход. Попробуй обновить страницу.");
          return;
        }

        if (data.session) {
          location.replace("/");
        }
      } catch (error) {
        showMessage(friendlyError(error));
      }
    }

    initializePage();
  </script>
</body>
</html>
