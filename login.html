<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Вход — Y-FETISH LIVE</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 26px 22px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
    }

    .logo {
      display: block;
      margin-bottom: 12px;
      text-align: center;
      text-decoration: none;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo-y { color: #ff1744; }
    .logo-fetish { color: #fff; }

    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: 22px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    button, input {
      width: 100%;
      min-height: 46px;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      padding: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .tab {
      background: #292929;
      color: #ddd;
    }

    .tab.active {
      background: #ff1744;
      color: #fff;
    }

    input {
      display: block;
      margin-bottom: 12px;
      padding: 0 13px;
      border: 1px solid #383838;
      background: #0d0d0d;
      color: #fff;
      outline: none;
    }

    input:focus { border-color: #ff1744; }

    .primary {
      background: #ff1744;
      color: #fff;
    }

    .forgot {
      display: block;
      width: auto;
      min-height: auto;
      margin: 0 0 14px auto;
      padding: 4px 0;
      background: transparent;
      color: #ff657f;
      font-weight: 400;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #252525;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .secondary {
      margin-top: 12px;
      background: transparent;
      color: #ccc;
      border: 1px solid #383838;
    }

    .home {
      display: block;
      margin-top: 20px;
      color: #aaa;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
    }

    .hidden { display: none !important; }
    button:disabled { opacity: .6; }
  </style>
</head>

<body>
  <main class="card">
    <a href="/" class="logo">
      <span class="logo-y">Y</span><span class="logo-fetish">-FETISH</span>
    </a>

    <h1 id="pageTitle">Вход в аккаунт</h1>

    <div class="tabs" id="tabs">
      <button type="button" class="tab active" id="loginTab">Войти</button>
      <button type="button" class="tab" id="signupTab">Регистрация</button>
    </div>

    <form id="authForm">
      <input id="email" type="email" placeholder="Email"
             autocomplete="email" required>

      <input id="password" type="password" placeholder="Пароль"
             autocomplete="current-password" minlength="6" required>

      <button type="button" class="forgot" id="forgotButton">
        Забыли пароль?
      </button>

      <button type="submit" class="primary" id="submitButton">Войти</button>
    </form>

    <form id="newPasswordForm" class="hidden">
      <input id="newPassword" type="password" placeholder="Новый пароль"
             minlength="6" autocomplete="new-password" required>

      <input id="repeatPassword" type="password"
             placeholder="Повторите новый пароль"
             minlength="6" autocomplete="new-password" required>

      <button type="submit" class="primary">Сохранить пароль</button>
    </form>

    <button type="button" class="secondary hidden" id="backButton">
      Вернуться ко входу
    </button>

    <div class="message" id="message" role="status" aria-live="polite"></div>
    <a href="/" class="home">← Вернуться к эфирам</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      "use strict";

      // ВСТАВЬ URL И ПУБЛИЧНЫЙ КЛЮЧ SUPABASE ДЛЯ Y-FETISH LIVE
      const SUPABASE_URL = "ВСТАВЬ_URL_ПРОЕКТА";
      const SUPABASE_PUBLIC_KEY = "ВСТАВЬ_PUBLIC_KEY";

      const $ = id => document.getElementById(id);

      const loginTab = $("loginTab");
      const signupTab = $("signupTab");
      const tabs = $("tabs");
      const authForm = $("authForm");
      const newPasswordForm = $("newPasswordForm");
      const emailInput = $("email");
      const passwordInput = $("password");
      const forgotButton = $("forgotButton");
      const submitButton = $("submitButton");
      const backButton = $("backButton");
      const pageTitle = $("pageTitle");

      let mode = "login";
      let recoveryMode = false;
      let supabaseClient = null;

      function message(text) {
        $("message").textContent = text;
        $("message").style.display = "block";
      }

      function clearMessage() {
        $("message").textContent = "";
        $("message").style.display = "none";
      }

      function setMode(nextMode) {
        mode = nextMode;
        recoveryMode = false;

        tabs.classList.remove("hidden");
        authForm.classList.remove("hidden");
        newPasswordForm.classList.add("hidden");
        backButton.classList.add("hidden");

        emailInput.classList.remove("hidden");
        passwordInput.classList.remove("hidden");
        passwordInput.required = true;
        forgotButton.classList.toggle("hidden", nextMode !== "login");

        loginTab.classList.toggle("active", nextMode === "login");
        signupTab.classList.toggle("active", nextMode === "signup");

        pageTitle.textContent =
          nextMode === "login" ? "Вход в аккаунт" : "Регистрация";

        submitButton.textContent =
          nextMode === "login" ? "Войти" : "Зарегистрироваться";

        passwordInput.autocomplete =
          nextMode === "login" ? "current-password" : "new-password";

        clearMessage();
      }

      // Переключение работает независимо от Supabase.
      loginTab.addEventListener("click", () => setMode("login"));
      signupTab.addEventListener("click", () => setMode("signup"));

      function showRecovery() {
        recoveryMode = true;
        tabs.classList.add("hidden");
        authForm.classList.remove("hidden");
        newPasswordForm.classList.add("hidden");
        backButton.classList.remove("hidden");

        passwordInput.classList.add("hidden");
        passwordInput.required = false;
        forgotButton.classList.add("hidden");
        submitButton.textContent = "Отправить ссылку";
        pageTitle.textContent = "Восстановление пароля";
        clearMessage();
      }

      function showNewPassword() {
        recoveryMode = true;
        tabs.classList.add("hidden");
        authForm.classList.add("hidden");
        newPasswordForm.classList.remove("hidden");
        backButton.classList.remove("hidden");
        pageTitle.textContent = "Новый пароль";
        clearMessage();
      }

      forgotButton.addEventListener("click", showRecovery);
      backButton.addEventListener("click", () => setMode("login"));

      // Проверяем подключение Supabase отдельно.
      try {
        if (!window.supabase) {
          throw new Error("Не загрузилась библиотека Supabase. Обнови страницу.");
        }

        if (
          SUPABASE_URL.includes("ВСТАВЬ_") ||
          SUPABASE_PUBLIC_KEY.includes("ВСТАВЬ_")
        ) {
          throw new Error("Вставь URL и публичный ключ своего проекта Supabase.");
        }

        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLIC_KEY
        );
      } catch (error) {
        message(error.message);
      }

      authForm.addEventListener("submit", async event => {
        event.preventDefault();
        clearMessage();

        if (!supabaseClient) {
          message("Проверь URL и публичный ключ Supabase в коде страницы.");
          return;
        }

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        submitButton.disabled = true;

        try {
          if (recoveryMode) {
            const { error } =
              await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: location.origin + "/login.html"
              });

            if (error) throw error;

            message("Проверь почту и открой ссылку для сброса пароля.");
            return;
          }

          if (mode === "signup") {
            const { data, error } = await supabaseClient.auth.signUp({
              email,
              password,
              options: {
                emailRedirectTo: location.origin + "/login.html"
              }
            });

            if (error) throw error;

            if (data.session) {
              message("Регистрация успешна. Переходим к эфирам...");
              location.replace("/");
            } else {
              message("Проверь почту и подтверди регистрацию, затем войди.");
            }
          } else {
            const { error } =
              await supabaseClient.auth.signInWithPassword({
                email,
                password
              });

            if (error) throw error;

            message("Вход выполнен. Переходим к эфирам...");
            location.replace("/");
          }
        } catch (error) {
          message("Ошибка: " + (error.message || "Попробуй ещё раз."));
        } finally {
          submitButton.disabled = false;
        }
      });

      newPasswordForm.addEventListener("submit", async event => {
        event.preventDefault();
        clearMessage();

        if (!supabaseClient) {
          message("Не удалось подключиться к Supabase.");
          return;
        }

        const password = $("newPassword").value;
        const repeat = $("repeatPassword").value;

        if (password.length < 6) {
          message("Пароль должен содержать минимум 6 символов.");
          return;
        }

        if (password !== repeat) {
          message("Пароли не совпадают.");
          return;
        }

        const button = newPasswordForm.querySelector("button");
        button.disabled = true;

        try {
          const { error } = await supabaseClient.auth.updateUser({ password });
          if (error) throw error;

          newPasswordForm.classList.add("hidden");
          message("Пароль изменён. Теперь вернись ко входу.");
          backButton.classList.remove("hidden");
        } catch (error) {
          message("Ошибка смены пароля: " + error.message);
        } finally {
          button.disabled = false;
        }
      });

      async function initRecovery() {
        if (!supabaseClient) return;

        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const query = new URLSearchParams(location.search);

        if (hash.get("type") === "recovery" ||
            query.get("type") === "recovery") {
          showNewPassword();
          return;
        }

        const { data } = await supabaseClient.auth.getSession();

        if (data.session &&
            (hash.has("access_token") || query.has("code"))) {
          showNewPassword();
        }
      }

      setMode("login");
      initRecovery();
    })();
  </script>
</body>
</html>
